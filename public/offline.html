<!doctype html>
<html lang="uz">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover" />
    <title>Internet aloqasi yo'q — Collabix</title>
    <meta name="theme-color" content="#14121F" />
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html, body {
        touch-action: pan-x pan-y;
        -ms-touch-action: pan-x pan-y;
      }
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        background-color: #14121F;
        color: #F8FAFC;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 24px;
        text-align: center;
      }
      .card {
        background: #1A172A;
        border: 1px solid #2D2845;
        border-radius: 24px;
        padding: 40px 28px;
        max-width: 440px;
        width: 100%;
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
      }
      .logo {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        font-size: 22px;
        font-weight: 900;
        letter-spacing: -0.5px;
        color: #FFFFFF;
        margin-bottom: 28px;
      }
      .dot {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: linear-gradient(135deg, #6366F1, #EC4899);
      }
      .icon-container {
        width: 80px;
        height: 80px;
        border-radius: 24px;
        background: rgba(99, 102, 241, 0.12);
        border: 1px solid rgba(99, 102, 241, 0.25);
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 0 auto 24px;
      }
      .icon-container svg {
        width: 40px;
        height: 40px;
        stroke: #818CF8;
      }
      h1 {
        font-size: 20px;
        font-weight: 800;
        margin-bottom: 12px;
        color: #FFFFFF;
      }
      p {
        font-size: 14px;
        line-height: 1.6;
        color: #94A3B8;
        margin-bottom: 28px;
      }
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        width: 100%;
        padding: 14px 24px;
        background: linear-gradient(135deg, #4F46E5, #7C3AED);
        color: #FFFFFF;
        font-weight: 700;
        font-size: 15px;
        border: none;
        border-radius: 14px;
        cursor: pointer;
        transition: transform 0.15s, opacity 0.15s;
        text-decoration: none;
      }
      .btn:active {
        transform: scale(0.98);
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="logo">
        <span>COLLABIX</span>
        <span class="dot"></span>
      </div>

      <div class="icon-container">
        <svg fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
          <line x1="1" y1="1" x2="23" y2="23"></line>
          <path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"></path>
          <path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"></path>
          <path d="M10.71 5.05A16 16 0 0 1 22.58 9"></path>
          <path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"></path>
          <path d="M8.53 16.11a6 6 0 0 1 6.95 0"></path>
          <line x1="12" y1="20" x2="12.01" y2="20"></line>
        </svg>
      </div>

      <h1>Internet aloqasi yo'q</h1>
      <p>
        Qurilmangizda internet aloqasi vaqtincha uzildi. Iltimos, Wi-Fi yoki mobil tarmoq ulanishini tekshiring va qayta urinib ko'ring.
      </p>

      <button class="btn" onclick="window.location.reload()">
        <span>Qayta urinish</span>
      </button>
    </div>
  </body>
</html>
