    <!-- Service Worker Registration & Preview Cache Protection -->
    <script>
      (function () {
        var host = window.location.hostname || '';
        var isInIframe = false;
        try {
          isInIframe = window.self !== window.top;
        } catch (e) {
          isInIframe = true;
        }

        // AI Studio Preview / dev muhitlarida (iframe, ais-dev-*, ais-pre-*, localhost)
        // Cloud Run auth proxy 302 redirect ishlatadi va Service Worker keshlangan eski fayllarni
        // ushlab qolib sayt ochilmasligiga sabab bo'ladi. Shu sabab preview muhitida SW va keshlarni to'liq tozalaymiz.
        var isPreviewEnv =
          isInIframe ||
          host.indexOf('ais-dev-') !== -1 ||
          host.indexOf('ais-pre-') !== -1 ||
          host === 'localhost' ||
          host === '127.0.0.1';

        if (isPreviewEnv) {
          var clearAllCaches = ('caches' in window)
            ? caches.keys().then(function (names) {
                return Promise.all(
                  names.map(function (name) {
                    return caches.delete(name);
                  })
                );
              }).catch(function () {})
            : Promise.resolve();

          if ('serviceWorker' in navigator) {
            var hadController = !!navigator.serviceWorker.controller;
            navigator.serviceWorker.getRegistrations().then(function (registrations) {
              return Promise.all(
                registrations.map(function (reg) {
                  return reg.unregister().catch(function () {});
                })
              );
            }).then(function () {
              return clearAllCaches;
            }).then(function () {
              if (hadController) {
                try {
                  if (!sessionStorage.getItem('collabix_sw_cleaned_v3')) {
                    sessionStorage.setItem('collabix_sw_cleaned_v3', '1');
                    window.location.reload();
                  }
                } catch (e) {}
              }
            }).catch(function () {});
          }
        } else {
          // Production domenda (masalan collabix.uz) eski keshlarni tozalab, yangi v3 Service Worker'ni ulash
          if ('caches' in window) {
            caches.keys().then(function (names) {
              names.forEach(function (name) {
                if (name !== 'collabix-cache-v3') {
                  caches.delete(name);
                }
              });
            }).catch(function () {});
          }

          if ('serviceWorker' in navigator) {
            window.addEventListener('load', function () {
              navigator.serviceWorker.register('/sw.js', { scope: '/' }).then(function (reg) {
                console.log('Service Worker muvaffaqiyatli ro‘yxatdan o‘tdi, scope:', reg.scope);
              }).catch(function (error) {
                console.debug('Service Worker yuklanishi o‘tkazib yuborildi:', error && error.message);
              });
            });
          }
        }
      })();

      // Extra protection against iOS Safari pinch-to-zoom gestures
      document.addEventListener('gesturestart', function (e) {
        e.preventDefault();
      }, { passive: false });
      document.addEventListener('gesturechange', function (e) {
        e.preventDefault();
      }, { passive: false });
      document.addEventListener('gestureend', function (e) {
        e.preventDefault();
      }, { passive: false });
    </script>
  </head>
  <body class="bg-[#F8FAFD] text-[#0F172A] antialiased selection:bg-[#4F46E5] selection:text-white">
